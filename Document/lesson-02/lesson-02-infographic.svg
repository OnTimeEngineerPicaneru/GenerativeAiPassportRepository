<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491">
<style>
text{font-family:"Noto Sans JP","Yu Gothic",sans-serif;fill:#16324f}.h{font-weight:700}.s{font-size:15px}.m{font-size:18px}.l{font-size:25px}.w{fill:#fff}.mut{fill:#5e7286}.card{fill:#fff;stroke:#d6e0ea;stroke-width:2}.b{fill:#2f6fed}.t{fill:#13a3b5}.p{fill:#7057d9}.o{fill:#f39a3f}.g{fill:#35a66f}</style>
<rect width="1055" height="1491" fill="#f4f7fb"/>
<rect width="1055" height="160" fill="#16324f"/>
<rect x="34" y="20" rx="12" width="160" height="38" class="b"/><text x="114" y="46" text-anchor="middle" class="h w m">LESSON 02</text>
<text x="35" y="105" class="h w" font-size="54">AIの基礎知識②</text><text x="36" y="140" class="h w l">機械学習・ディープラーニング・過学習を1枚で整理</text>
<rect x="25" y="180" rx="18" width="500" height="380" class="card"/><circle cx="55" cy="215" r="22" class="b"/><text x="55" y="222" text-anchor="middle" class="h w l">1</text><text x="88" y="223" class="h l">ルールベースと機械学習</text>
<rect x="48" y="250" rx="12" width="215" height="125" fill="#eaf1ff" stroke="#2f6fed"/><text x="155" y="280" text-anchor="middle" class="h m" fill="#2f6fed">ルールベース</text><text x="155" y="318" text-anchor="middle" class="m">人間が条件ルールを書く</text><text x="155" y="345" text-anchor="middle" class="s mut">説明しやすい／更新が必要</text>
<rect x="282" y="250" rx="12" width="215" height="125" fill="#e6f7f8" stroke="#13a3b5"/><text x="390" y="280" text-anchor="middle" class="h m" fill="#13a3b5">機械学習</text><text x="390" y="318" text-anchor="middle" class="m">AIがパターンを発見</text><text x="390" y="345" text-anchor="middle" class="s mut">複雑問題に強い／説明しにくい</text>
<text x="48" y="410" class="h m">比較ポイント</text><line x1="48" y1="425" x2="497" y2="425" stroke="#d6e0ea"/><text x="60" y="452" class="s">作成者</text><text x="255" y="452" class="s">人間</text><text x="405" y="452" class="s">AI</text><text x="60" y="482" class="s">新状況</text><text x="225" y="482" class="s">ルール追記</text><text x="380" y="482" class="s">データから適応</text><text x="60" y="512" class="s">説明性</text><text x="255" y="512" class="s">高い</text><text x="405" y="512" class="s">低め</text><rect x="48" y="525" rx="10" width="449" height="25" fill="#fff1e2"/><text x="272" y="543" text-anchor="middle" class="h s" fill="#b55d00">機械学習はルール自体を「発見」する技術</text>
<rect x="540" y="180" rx="18" width="490" height="380" class="card"/><circle cx="570" cy="215" r="22" class="t"/><text x="570" y="222" text-anchor="middle" class="h w l">2</text><text x="603" y="223" class="h l">機械学習の4つの手法</text>
<g class="h m"><rect x="565" y="255" rx="12" width="210" height="125" fill="#eaf1ff" stroke="#2f6fed"/><text x="670" y="285" text-anchor="middle">教師あり学習</text><text x="670" y="318" text-anchor="middle" class="s">正解ラベルあり</text><text x="670" y="345" text-anchor="middle" class="s mut">分類・回帰</text><rect x="795" y="255" rx="12" width="210" height="125" fill="#e6f7f8" stroke="#13a3b5"/><text x="900" y="285" text-anchor="middle">教師なし学習</text><text x="900" y="318" text-anchor="middle" class="s">ラベルなし</text><text x="900" y="345" text-anchor="middle" class="s mut">クラスタリング・次元削減</text><rect x="565" y="400" rx="12" width="210" height="125" fill="#fff1e2" stroke="#f39a3f"/><text x="670" y="430" text-anchor="middle">強化学習</text><text x="670" y="463" text-anchor="middle" class="s">報酬で学習</text><text x="670" y="490" text-anchor="middle" class="s mut">最適行動を発見</text><rect x="795" y="400" rx="12" width="210" height="125" fill="#f0ecff" stroke="#7057d9"/><text x="900" y="430" text-anchor="middle">半教師あり学習</text><text x="900" y="463" text-anchor="middle" class="s">一部だけラベル</text><text x="900" y="490" text-anchor="middle" class="s mut">少量ラベル＋大量未ラベル</text></g>
<rect x="25" y="580" rx="18" width="1005" height="330" class="card"/><circle cx="55" cy="615" r="22" class="p"/><text x="55" y="622" text-anchor="middle" class="h w l">3</text><text x="88" y="623" class="h l">ニューラルネットワークとディープラーニング</text>
<text x="55" y="665" class="h m" fill="#7057d9">入力層 → 隠れ層 → 出力層</text><g stroke="#a9b9cc" stroke-width="2"><line x1="150" y1="720" x2="310" y2="700"/><line x1="150" y1="720" x2="310" y2="750"/><line x1="150" y1="770" x2="310" y2="700"/><line x1="150" y1="770" x2="310" y2="750"/><line x1="310" y1="700" x2="460" y2="735"/><line x1="310" y1="750" x2="460" y2="735"/></g><g fill="#2f6fed"><circle cx="150" cy="720" r="12"/><circle cx="150" cy="770" r="12"/></g><g fill="#7057d9"><circle cx="310" cy="700" r="12"/><circle cx="310" cy="750" r="12"/></g><circle cx="460" cy="735" r="12" fill="#35a66f"/><text x="55" y="825" class="s">重みを調整 → 誤差を計算 → 逆伝播 → 精度改善</text>
<rect x="520" y="660" rx="12" width="480" height="200" fill="#fafbfd" stroke="#d6e0ea"/><text x="640" y="692" class="h m" fill="#2f6fed">従来の機械学習</text><text x="840" y="692" class="h m" fill="#7057d9">ディープラーニング</text><text x="550" y="735" class="s">特徴量</text><text x="660" y="735" class="s">人間が設計</text><text x="850" y="735" class="s">AIが自動抽出</text><text x="550" y="775" class="s">データ量</text><text x="660" y="775" class="s">少量でも可</text><text x="850" y="775" class="s">大量に必要</text><text x="550" y="815" class="s">計算</text><text x="660" y="815" class="s">比較的少ない</text><text x="850" y="815" class="s">高い（GPU）</text><rect x="520" y="870" rx="10" width="480" height="25" fill="#f0ecff"/><text x="760" y="888" text-anchor="middle" class="h s" fill="#7057d9">特徴量をAIが自動抽出する</text>
<rect x="25" y="930" rx="18" width="500" height="300" class="card"/><circle cx="55" cy="965" r="22" class="o"/><text x="55" y="972" text-anchor="middle" class="h w l">4</text><text x="88" y="973" class="h l">過学習と対策</text><text x="50" y="1010" class="s">学習データを覚えすぎ、未知データに弱くなる状態。</text><rect x="50" y="1040" rx="10" width="190" height="70" fill="#fff1e2"/><text x="145" y="1068" text-anchor="middle" class="s">学習データ精度</text><text x="145" y="1096" text-anchor="middle" class="h l" fill="#f39a3f">高い</text><rect x="260" y="1040" rx="10" width="190" height="70" fill="#eaf1ff"/><text x="355" y="1068" text-anchor="middle" class="s">未知データ精度</text><text x="355" y="1096" text-anchor="middle" class="h l" fill="#2f6fed">低い</text><text x="50" y="1140" class="h m" fill="#f39a3f">主な対策</text><text x="50" y="1170" class="s">アーリーストッピング　正則化</text><text x="50" y="1200" class="s">ドロップアウト　　　　データ拡張</text>
<rect x="540" y="930" rx="18" width="490" height="300" class="card"/><circle cx="570" cy="965" r="22" class="g"/><text x="570" y="972" text-anchor="middle" class="h w l">5</text><text x="603" y="973" class="h l">転移学習とノーフリーランチ定理</text><rect x="565" y="1010" rx="12" width="440" height="85" fill="#e9f7ef"/><text x="585" y="1040" class="h m" fill="#35a66f">転移学習</text><text x="585" y="1070" class="s">学習済みモデルを別タスクへ活用し、微調整する。</text><rect x="565" y="1110" rx="12" width="440" height="85" fill="#f0ecff"/><text x="585" y="1140" class="h m" fill="#7057d9">ノーフリーランチ定理</text><text x="585" y="1170" class="s">万能な手法はない。問題に応じた選択が重要。</text>
<rect x="25" y="1250" rx="18" width="1005" height="190" fill="#16324f"/><circle cx="55" cy="1285" r="22" class="b"/><text x="55" y="1292" text-anchor="middle" class="h w l">6</text><text x="88" y="1293" class="h w l">Lesson 02 重要キーワード</text>
<text x="55" y="1340" class="h w s">学習済みモデル　　汎化能力　　クラスタリング　　次元削減　　重み</text><text x="55" y="1380" class="h w s">逆伝播　　　　　　特徴量　　　正則化　　　　　　ドロップアウト</text><text x="25" y="1470" class="s">生成AIパスポート対策講座</text><text x="1030" y="1470" text-anchor="end" class="s mut">Source: Document/lesson-02/lesson-02.md</text>
</svg>